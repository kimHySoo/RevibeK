server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # vue-router createWebHistory() — 새로고침/딥링크 시 404 대신 index.html로 폴백
    location / {
        try_files $uri $uri/ /index.html;
    }

    # /api/* 를 backend 컨테이너로 전달 (compose 서비스명 backend:8080)
    location /api/ {
        proxy_pass http://backend:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 기본값(60초)이 라디오 생성(FastAPI 4분 타임아웃)보다 짧아서 주거용 프록시로 yt-dlp가
        # 느려지면 504로 끊기던 문제. backend의 FastApiClient readTimeout(4분)보다 여유있게 설정.
        proxy_connect_timeout 10s;
        proxy_send_timeout 270s;
        proxy_read_timeout 270s;
    }

    # Swagger UI / OpenAPI 문서 (개발 편의용)
    location ~ ^/(swagger-ui|v3/api-docs) {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # OAuth2 콜백 등 /api 접두사 없는 BE 경로 (SecurityConfig 1번 규칙: /oauth2/**, /login/oauth2/**, /auth/google/callback)
    location ~ ^/(oauth2|login/oauth2|auth/google/callback) {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
