server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # vue-router createWebHistory() — 새로고침/딥링크 시 404 대신 index.html로 폴백
    location / {
        try_files $uri $uri/ /index.html;
    }

    # /api/* 를 backend 컨테이너로 전달 (compose 서비스명 backend:8080)
    location /api/ {
        proxy_pass http://backend:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # OAuth2 콜백 등 /api 접두사 없는 BE 경로 (SecurityConfig 1번 규칙: /oauth2/**, /login/oauth2/**, /auth/google/callback)
    location ~ ^/(oauth2|login/oauth2|auth/google/callback) {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
