services:
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: kpop_radio
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    volumes:
      - mysql-data:/var/lib/mysql
      # 파일명 앞 번호로 적용 순서를 강제 (docker-entrypoint-initdb.d는 알파벳 순으로 실행됨)
      # - migration_add_radio_session_playlist_id.sql은 kpop_radio_schema.sql에 이미 병합되어 있어 제외(중복 컬럼 에러 발생).
      # - migration_add_public_radio_feed.sql이 challenges 테이블을 ALTER하므로, challenges를 CREATE하는
      #   migration_add_review_follow_plan_challenge.sql보다 반드시 나중에 실행되어야 한다.
      - ./RevibeK/src/main/resources/sql/kpop_radio_schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./RevibeK/src/main/resources/sql/migration_add_review_follow_plan_challenge.sql:/docker-entrypoint-initdb.d/02-migration.sql:ro
      - ./RevibeK/src/main/resources/sql/migration_add_public_radio_feed.sql:/docker-entrypoint-initdb.d/03-migration.sql:ro
      - ./RevibeK/src/main/resources/sql/migration_replace_songs_data.sql:/docker-entrypoint-initdb.d/04-migration.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [revibek-net]

  qdrant:
    image: qdrant/qdrant:latest
    restart: unless-stopped
    volumes:
      - qdrant-data:/qdrant/storage
    networks: [revibek-net]

  ai:
    build: ./RevibeK_AI
    restart: unless-stopped
    volumes:
      - ai-downloads:/app/downloads
      - song-embeddings:/app/song_embeddings
    networks: [revibek-net]

  backend:
    build: ./RevibeK
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      qdrant:
        condition: service_started
      ai:
        condition: service_started
    environment:
      DB_URL: jdbc:mysql://mysql:3306/kpop_radio?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Seoul&characterEncoding=UTF-8
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      FASTAPI_ENABLED: ${FASTAPI_ENABLED:-true}
      FASTAPI_URL: http://ai:8000
      FASTAPI_LAUNCHER_ENABLED: "false" # ai를 별도 컨테이너로 분리했으므로 backend가 자체 프로세스로 띄우면 안 됨
      # SongEmbeddingServiceImpl이 new File(fastApiProjectPath, "song_embeddings")로 경로를 만듦.
      # 컨테이너 WORKDIR이 /app이므로 결과 경로가 /app/song_embeddings가 되도록 맞춤(기본값 ../RevibeK_AI는 컨테이너에 없음).
      FASTAPI_PROJECT_PATH: /app
      QDRANT_ENABLED: ${QDRANT_ENABLED:-true}
      QDRANT_HOST: qdrant
      QDRANT_PORT: 6334
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
      JWT_SECRET: ${JWT_SECRET}
      GOOGLE_OAUTH_ENABLED: ${GOOGLE_OAUTH_ENABLED:-false}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI}
      OAUTH_FRONTEND_REDIRECT_URL: ${OAUTH_FRONTEND_REDIRECT_URL}
      GMS_KEY: ${GMS_KEY}
      GMS_OPENAI_ENABLED: ${GMS_OPENAI_ENABLED:-false}
      GMS_MODEL: ${GMS_MODEL}
      YOUTUBE_ENABLED: ${YOUTUBE_ENABLED:-true}
      YOUTUBE_API_KEY: ${YOUTUBE_API_KEY}
      SPOTIFY_ENABLED: ${SPOTIFY_ENABLED:-false}
      CLIENT_ID: ${CLIENT_ID}
      CLIENT_SECRET: ${CLIENT_SECRET}
      TTS_ENABLED: ${TTS_ENABLED:-false}
      GCP_TTS_API_KEY: ${GCP_TTS_API_KEY}
      EMAIL_VERIFICATION_MODE: ${EMAIL_VERIFICATION_MODE:-mock}
      SMTP_USERNAME: ${SMTP_USERNAME}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
    volumes:
      - song-embeddings:/app/song_embeddings
    networks: [revibek-net]

  frontend:
    build:
      context: ./RevibeK_FE
      args:
        VITE_API_BASE_URL: /api
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"
    networks: [revibek-net]

networks:
  revibek-net:

volumes:
  mysql-data:
  qdrant-data:
  ai-downloads:
  song-embeddings:
