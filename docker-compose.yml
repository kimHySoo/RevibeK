services:
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: kpop_radio_2
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    volumes:
      - mysql-data:/var/lib/mysql
      # 파일명 앞 번호로 적용 순서를 강제 (docker-entrypoint-initdb.d는 알파벳 순으로 실행됨)
      - ./RevibeK/src/main/resources/sql/schema_v2_ddl.sql:/docker-entrypoint-initdb.d/01-ddl.sql:ro
      - ./RevibeK/src/main/resources/sql/schema_v2_seed_data.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
      - ./RevibeK/src/main/resources/sql/schema_v2_songs_load.sql:/docker-entrypoint-initdb.d/03-songs.sql:ro
      - ./RevibeK/src/main/resources/sql/schema_v2_embedding_songs_load.sql:/docker-entrypoint-initdb.d/04-embeddings.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [revibek-net]

  qdrant:
    image: qdrant/qdrant:latest
    restart: unless-stopped
    volumes:
      - qdrant-data:/qdrant/storage
    networks: [revibek-net]

  ai:
    build: ./RevibeK_AI
    restart: unless-stopped
    volumes:
      - ai-downloads:/app/downloads
      - song-embeddings:/app/song_embeddings
    networks: [revibek-net]

  backend:
    build: ./RevibeK
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      qdrant:
        condition: service_started
      ai:
        condition: service_started
    environment:
      # GOOGLE_OAUTH_ENABLED/GOOGLE_CLIENT_ID 등 env→property 매핑이 application-prod.properties에만
      # 있어서, 이 프로필이 활성화되지 않으면 Google 로그인이 항상 비활성 상태가 된다(error08.md).
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: jdbc:mysql://mysql:3306/kpop_radio_2?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Seoul&characterEncoding=UTF-8
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      FASTAPI_ENABLED: ${FASTAPI_ENABLED:-true}
      FASTAPI_URL: http://ai:8000
      FASTAPI_LAUNCHER_ENABLED: "false" # ai를 별도 컨테이너로 분리했으므로 backend가 자체 프로세스로 띄우면 안 됨
      # SongEmbeddingServiceImpl이 new File(fastApiProjectPath, "song_embeddings")로 경로를 만듦.
      # 컨테이너 WORKDIR이 /app이므로 결과 경로가 /app/song_embeddings가 되도록 맞춤(기본값 ../RevibeK_AI는 컨테이너에 없음).
      FASTAPI_PROJECT_PATH: /app
      QDRANT_ENABLED: ${QDRANT_ENABLED:-true}
      QDRANT_HOST: qdrant
      QDRANT_PORT: 6334
      AUTO_SYNC_QDRANT_ON_STARTUP: ${AUTO_SYNC_QDRANT_ON_STARTUP:-false}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
      JWT_SECRET: ${JWT_SECRET}
      GOOGLE_OAUTH_ENABLED: ${GOOGLE_OAUTH_ENABLED:-false}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI}
      OAUTH_FRONTEND_REDIRECT_URL: ${OAUTH_FRONTEND_REDIRECT_URL}
      GMS_ENABLED: ${GMS_ENABLED:-false}
      GMS_KEY: ${GMS_KEY}
      GMS_CLAUDE_MODEL: ${GMS_CLAUDE_MODEL:-claude-sonnet-4-5-20250929}
      GMS_OPENAI_ENABLED: ${GMS_OPENAI_ENABLED:-false}
      GMS_MODEL: ${GMS_MODEL}
      YOUTUBE_ENABLED: ${YOUTUBE_ENABLED:-true}
      YOUTUBE_API_KEY: ${YOUTUBE_API_KEY}
      SPOTIFY_ENABLED: ${SPOTIFY_ENABLED:-false}
      CLIENT_ID: ${CLIENT_ID}
      CLIENT_SECRET: ${CLIENT_SECRET}
      TTS_ENABLED: ${TTS_ENABLED:-false}
      GCP_TTS_API_KEY: ${GCP_TTS_API_KEY}
      TTS_LANGUAGE_CODE: ${TTS_LANGUAGE_CODE:-ko-KR}
      TTS_VOICE: ${TTS_VOICE:-ko-KR-Chirp3-HD-Vindemiatrix}
      TTS_AUDIO_ENCODING: ${TTS_AUDIO_ENCODING:-MP3}
      TTS_SPEAKING_RATE: ${TTS_SPEAKING_RATE:-1.0}
      TTS_PITCH: ${TTS_PITCH:-}
      SWAGGER_ENABLED: ${SWAGGER_ENABLED:-true}
      EMAIL_VERIFICATION_MODE: ${EMAIL_VERIFICATION_MODE:-mock}
      SMTP_HOST: ${SMTP_HOST:-smtp.gmail.com}
      SMTP_USERNAME: ${SMTP_USERNAME}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
    volumes:
      - song-embeddings:/app/song_embeddings
    networks: [revibek-net]

  frontend:
    build:
      context: ./RevibeK_FE
      args:
        VITE_API_BASE_URL: /api
        VITE_USE_MOCK: "false"
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"
    networks: [revibek-net]

networks:
  revibek-net:

volumes:
  mysql-data:
  qdrant-data:
  ai-downloads:
  song-embeddings:
