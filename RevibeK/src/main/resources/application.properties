spring.application.name=RevibeK
spring.profiles.include=${SPRING_PROFILES_INCLUDE:secret}

# dataSource
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/kpop_radio?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Seoul&characterEncoding=UTF-8}
spring.datasource.username=${DB_USERNAME:SSAFY}
spring.datasource.password=${DB_PASSWORD:SSAFY}

# mybatis
mybatis.mapper-locations=classpath*:mapper/**/*.xml
mybatis.type-aliases-package=com.ssafy.revibek
mybatis.configuration.map-underscore-to-camel-case=true

# swagger / openapi (운영 배포 시 SWAGGER_ENABLED=false로 노출 차단)
springdoc.api-docs.enabled=${SWAGGER_ENABLED:true}
springdoc.swagger-ui.enabled=${SWAGGER_ENABLED:true}

# security
spring.security.user.name=${SPRING_SECURITY_USER_NAME:admin}
spring.security.user.password=${SPRING_SECURITY_USER_PASSWORD:1234}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173,http://127.0.0.1:3000,http://127.0.0.1:5173}

# jwt
jwt.secret=${JWT_SECRET:revibek-dev-secret-key-change-me-32bytes}
jwt.access-token-expiration-ms=${JWT_ACCESS_TOKEN_EXPIRATION_MS:3600000}
jwt.refresh-token-expiration-ms=${JWT_REFRESH_TOKEN_EXPIRATION_MS:1209600000}

# oauth2 google
app.oauth.google.enabled=${GOOGLE_OAUTH_ENABLED:false}
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:}
spring.security.oauth2.client.registration.google.scope=openid,profile,email
spring.security.oauth2.client.registration.google.redirect-uri=${GOOGLE_REDIRECT_URI:http://localhost:8080/auth/google/callback}
# Google 로그인 성공/실패 후 돌아갈 프론트엔드 주소. 토큰은 쿼리스트링이 아니라
# URL 프래그먼트(#)로 전달되어 서버 로그에 남지 않는다.
app.oauth.frontend-redirect-url=${OAUTH_FRONTEND_REDIRECT_URL:http://localhost:5173}

# smtp mail
# mode=mock  : 실제 메일을 보내지 않고 mock-code(고정값)를 인증코드로 사용한다. 발표/로컬 개발 기본값.
# mode=smtp  : 실제 Gmail SMTP로 메일을 발송한다. spring.mail.* 설정이 모두 필요하다.
#
# Gmail SMTP를 사용하려면 SMTP_PASSWORD에 "일반 Gmail 로그인 비밀번호"가 아니라
# Google 계정 > 보안 > 2단계 인증 활성화 후 발급받는 "앱 비밀번호(App Password)"를 사용해야 한다.
# 일반 비밀번호를 사용하면 항상 MailAuthenticationException(Authentication failed)이 발생한다.
# 발급 경로: https://myaccount.google.com/apppasswords
app.email.verification.mode=${EMAIL_VERIFICATION_MODE:mock}
app.email.verification.mock-code=${EMAIL_VERIFICATION_MOCK_CODE:123456}
# fail-open=true: SMTP 인증/발송이 실패해도 예외를 던지지 않고 콘솔 로그로 대체하여
#                 회원가입/로그인 흐름이 깨지지 않게 한다(발표/개발용 안전장치).
# fail-open=false: 발송 실패 시 503(EmailSendFailedException)을 클라이언트에 반환한다(운영 권장).
app.email.verification.fail-open=${EMAIL_VERIFICATION_FAIL_OPEN:true}
spring.mail.host=${SMTP_HOST:}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${SMTP_STARTTLS:true}



# gms claude
gms.enabled=${GMS_ENABLED:false}
gms.api.base-url=${GMS_API_BASE_URL:https://gms.ssafy.io/gmsapi/api.anthropic.com/v1/messages}
gms.api.key=${GMS_KEY:}
gms.api.anthropic-version=2023-06-01
gms.api.model=claude-3-7-sonnet-latest
gms.api.max-tokens=300
gms.api.budget-credit=30
gms.api.input-cost-per-1k=0.03
gms.api.output-cost-per-1k=0.15

# gms openai (gpt) - 곡 제목/아티스트 분리
gms.openai.enabled=${GMS_OPENAI_ENABLED:false}
gms.openai.base-url=${GMS_OPENAI_BASE_URL:https://gms.ssafy.io/gmsapi/api.openai.com/v1/responses}
gms.openai.api-key=${GMS_KEY:}
gms.openai.model=${GMS_MODEL:gpt-4.1}


# spotify - 곡 발매연도 기반 era/generation 채우기
spotify.enabled=${SPOTIFY_ENABLED:false}
spotify.client-id=${CLIENT_ID:}
spotify.client-secret=${CLIENT_SECRET:}

# google cloud text-to-speech
tts.enabled=${TTS_ENABLED:false}
gcp.tts.base-url=${GCP_TTS_BASE_URL:https://texttospeech.googleapis.com/v1}
gcp.tts.api-key=${GCP_TTS_API_KEY:}
gcp.tts.default-language-code=${TTS_LANGUAGE_CODE:ko-KR}
gcp.tts.default-voice-name=${TTS_VOICE:ko-KR-Chirp3-HD-Vindemiatrix}
gcp.tts.default-audio-encoding=${TTS_AUDIO_ENCODING:MP3}
gcp.tts.default-speaking-rate=${TTS_SPEAKING_RATE:1.0}
gcp.tts.default-pitch=${TTS_PITCH:}

# youtube
youtube.enabled=${YOUTUBE_ENABLED:true}
youtube.api.key=${YOUTUBE_API_KEY:}
youtube.fallback.mode=${YOUTUBE_FALLBACK_MODE:db}

# vector / qdrant
vector.enabled=${VECTOR_ENABLED:true}
vector.provider=${VECTOR_PROVIDER:qdrant}
qdrant.enabled=${QDRANT_ENABLED:true}
qdrant.host=${QDRANT_HOST:localhost}
qdrant.port=${QDRANT_PORT:6334}
qdrant.collection=${QDRANT_COLLECTION:revibek_songs}
qdrant.text-collection=${QDRANT_TEXT_COLLECTION:revibek_song_text_embeddings}
app.qdrant.auto-sync-on-startup=${AUTO_SYNC_QDRANT_ON_STARTUP:false}

# gms openai embedding - 곡 메타데이터 임베딩
gms.openai.embedding-url=${GMS_OPENAI_EMBEDDING_URL:https://gms.ssafy.io/gmsapi/api.openai.com/v1/embeddings}
gms.openai.embedding-model=${GMS_EMBEDDING_MODEL:text-embedding-3-small}

# fastapi
fastapi.enabled=${FASTAPI_ENABLED:true}
fastapi.host=${FASTAPI_URL:http://localhost:8000}
fastapi.project.path=${FASTAPI_PROJECT_PATH:../RevibeK_AI}
fastapi.launcher.enabled=${FASTAPI_LAUNCHER_ENABLED:false}

# dev seed account (DataInitializer)
app.dev.seed-user.email=dev@revibek.local
app.dev.seed-user.password=revibek1234
# 유니코드 코드포인트 escape(U+AC1C U+BC1C U+C790) 사용: java.util.Properties가 .properties
# 파일을 ISO-8859-1로 읽기 때문에 UTF-8 한글을 그대로 쓰면 깨진다(예: "ê°ë°ìž").
# 코드포인트 escape는 인코딩과 무관하게 정확히 해석되므로 이 문제가 발생하지 않는다.
app.dev.seed-user.nickname=\uac1c\ubc1c\uc790



