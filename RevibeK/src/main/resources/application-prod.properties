# ============================================================
# Prod 환경 설정 — 실제 SMTP + 환경변수 필수
# 실행: SPRING_PROFILES_ACTIVE=prod java -jar app.jar
#
# Gmail 앱 비밀번호 발급 방법:
#   1. Google 계정 → 보안 → 2단계 인증 활성화
#   2. 보안 → 앱 비밀번호 → 앱: '메일', 기기: '기타(직접 입력)'
#   3. 생성된 16자리 비밀번호를 SMTP_PASSWORD 환경변수에 설정
#   (일반 Google 계정 비밀번호는 사용 불가 — MailAuthenticationException 발생)
# ============================================================

# 이메일 인증 — 실제 SMTP 발송
app.email.verification.mode=smtp
app.email.verification.fallback-on-failure=false

# Gmail SMTP 설정
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${SMTP_USERNAME}
spring.mail.password=${SMTP_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# DB (운영)
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# JWT (운영 — 반드시 32바이트 이상 랜덤 문자열)
jwt.secret=${JWT_SECRET}
jwt.access-token-expiration-ms=3600000
jwt.refresh-token-expiration-ms=1209600000

# CORS (운영 도메인)
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS}

# Google OAuth (필요 시 활성화)
app.oauth.google.enabled=${GOOGLE_OAUTH_ENABLED:false}
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:}
spring.security.oauth2.client.registration.google.redirect-uri=${GOOGLE_REDIRECT_URI:}
app.oauth.frontend-redirect-url=${OAUTH_FRONTEND_REDIRECT_URL:http://localhost:5173}
